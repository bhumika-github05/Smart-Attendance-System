{% extends "base.html" %}
{% block content %}

<div class="card p-4">

<h4>Attendance Records</h4>

<div class="table-responsive">

<table class="table table-hover">
<thead>
<tr>
<th>Name</th>
<th>Time</th>
</tr>
</thead>

<tbody>
{% for row in data %}
<tr>
<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
</tr>
{% endfor %}
</tbody>

</table>

</div>
</div>

{% endblock %}
